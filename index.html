<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZDANŞER ULTIMATE | QUANTUM SYSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;900&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <!-- FIREBASE KÜTÜPHANELERİ -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg-deep: #030005;
            --bg-dark: #0a0112;
            --card-bg: rgba(15, 2, 28, 0.95);
            --accent: #a855f7;
            --accent-bright: #d8b4fe;
            --accent-glow: rgba(168, 85, 247, 0.5);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --danger: #ff4757;
            --success: #2ed573;
            --warning: #ffa502;
            --border-style: 1px solid rgba(168, 85, 247, 0.25);
            --panel-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 20px var(--accent-glow);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.4;
        }

        .scanline {
            width: 100%;
            height: 100px;
            z-index: 2;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(168, 85, 247, 0.05) 50%, rgba(0, 0, 0, 0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scanline 8s linear infinite;
            pointer-events: none;
        }

        @keyframes scanline {
            0% { bottom: 100%; }
            100% { bottom: -100px; }
        }

        #auth-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            background: radial-gradient(circle at center, transparent, var(--bg-deep));
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .auth-card {
            width: 480px;
            padding: 60px;
            background: var(--card-bg);
            border-radius: 40px;
            border: var(--border-style);
            box-shadow: var(--panel-shadow);
            backdrop-filter: blur(25px);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, transparent, transparent, var(--accent));
            animation: rotate-border 6s linear infinite;
            z-index: -1;
        }

        @keyframes rotate-border {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .auth-card h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            letter-spacing: 12px;
            margin-bottom: 10px;
            color: var(--accent);
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .auth-card p {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            color: var(--accent);
            font-weight: 700;
        }

        .ez-input {
            width: 100%;
            padding: 18px 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(168, 85, 247, 0.1);
            border-radius: 16px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .ez-input:focus {
            background: rgba(168, 85, 247, 0.08);
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
        }

        .auth-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 25px 0;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            cursor: pointer;
            gap: 10px;
        }

        .checkbox-container input {
            accent-color: var(--accent);
            width: 18px;
            height: 18px;
        }

        .btn-glow {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(45deg, var(--accent), #6d28d9);
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 10px 30px -10px var(--accent);
            transition: 0.4s;
            position: relative;
            overflow: hidden;
        }

        .btn-glow:hover {
            transform: translateY(-3px);
            filter: brightness(1.2);
            box-shadow: 0 15px 40px -10px var(--accent);
        }

        .auth-switch {
            margin-top: 25px;
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .auth-switch span {
            color: var(--accent);
            cursor: pointer;
            font-weight: 700;
        }

        #main-dashboard {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 50;
            background: var(--bg-deep);
            flex-direction: column;
        }

        .topbar {
            height: 80px;
            background: rgba(10, 1, 18, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: var(--border-style);
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.5rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 8px 15px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .avatar-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--accent), #4f46e5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: white;
            font-size: 0.9rem;
            border: 2px solid var(--accent);
        }

        .dashboard-body {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            background: rgba(10, 1, 18, 0.5);
            border-right: var(--border-style);
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-link {
            padding: 16px 20px;
            border-radius: 16px;
            color: var(--text-dim);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 600;
            transition: 0.3s;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .nav-link:hover {
            background: rgba(168, 85, 247, 0.05);
            color: white;
            padding-left: 25px;
        }

        .nav-link.active {
            background: rgba(168, 85, 247, 0.15);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.1);
        }

        .admin-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .section-label {
            font-size: 0.65rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            margin-left: 20px;
            font-weight: 900;
        }

        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            position: relative;
        }

        .grid-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--card-bg);
            border: var(--border-style);
            border-radius: 24px;
            padding: 30px;
            position: relative;
            overflow: hidden;
            transition: 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            background: rgba(15, 2, 28, 1);
        }

        .stat-card h3 {
            font-size: 0.8rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--accent);
        }

        .glass-panel {
            background: var(--card-bg);
            border: var(--border-style);
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .ez-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            overflow-x: auto;
            display: block;
        }

        .ez-table thead, .ez-table tbody {
            display: table;
            width: 100%;
        }

        .ez-table th {
            padding: 15px;
            font-size: 0.75rem;
            color: var(--accent);
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .ez-table td {
            padding: 18px 15px;
            font-size: 0.9rem;
            color: var(--text-main);
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }

        .badge {
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-admin { background: rgba(168, 85, 247, 0.2); color: var(--accent); border: 1px solid var(--accent); }
        .badge-user { background: rgba(148, 163, 184, 0.1); color: var(--text-dim); }

        #notif-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .notif {
            width: 350px;
            padding: 20px;
            background: rgba(15, 2, 28, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border-left: 5px solid var(--accent);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: slideIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 40px;
        }

        .profile-card {
            text-align: center;
        }

        .profile-avatar-big {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 0 auto 20px;
            border: 4px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            background: var(--bg-dark);
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .btn-action {
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid var(--accent);
            background: transparent;
            color: white;
            cursor: pointer;
            transition: 0.3s;
            margin-left: 10px;
        }

        .btn-action:hover {
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .password-text {
            font-family: 'JetBrains Mono', monospace;
            color: var(--warning);
            font-weight: 700;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 5px;
            background: rgba(255, 165, 2, 0.1);
        }

        .ip-cell {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
        }

        @media (max-width: 1000px) {
            .sidebar { width: 80px; }
            .nav-link span, .section-label { display: none; }
            .sidebar { padding: 30px 10px; }
            .ez-table { font-size: 0.7rem; }
            .ez-table td, .ez-table th { padding: 8px; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="main-dashboard">
        <div class="topbar">

                <div class="status-dot"></div>
                EZDANŞER <span style="font-weight: 300; font-size: 0.8rem; color: white;">QUANTUM SYSTEM</span>
            </div>

            <div style="display: flex; gap: 30px; align-items: center;">
                <div id="server-time" style="font-family: 'JetBrains Mono'; font-size: 0.9rem; color: var(--accent);">00:00:00</div>

                    <div style="text-align: right;">
                        <div id="top-user-name" style="font-weight: 900; font-size: 0.85rem;">Admin</div>

            </div>
        </div>

        <div class="dashboard-body">
            <div class="sidebar">
                <div class="section-label">Main Console</div>
                <div class="nav-link active" onclick="switchTab('home', this)">🏠 <span>Dashboard</span></div>
                <div class="nav-item nav-link" onclick="switchTab('software', this)">🎯 <span>HACKŞER</span></div>
                <div class="nav-item nav-link" onclick="switchTab('settings', this)">⚙️ <span>Profil Ayarları</span></div>

                    <div class="admin-section">
                        <div class="section-label">Admin Control</div>
                        <div class="nav-link" onclick="switchTab('users', this)">🛡️ <span>Kullanıcı Yönetimi</span></div>
                        <div class="nav-link" onclick="switchTab('logs', this)">📜 <span>Sistem Logları</span></div>
                    </div>
                </div>

                    <div class="nav-link" style="color: var(--danger);" onclick="systemLogout()">🚪 <span>Bağlantıyı Kes</span></div>

    <div id="notif-container"></div>

    <script>
        // ============================================
        // EZDANŞER ULTIMATE - QUANTUM SYSTEM
        // ============================================
        
        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyDeLMAKuprzkCT87w_kArdRw0aEQEv_KE",
            authDomain: "ezdanser-v15.firebaseapp.com",
            databaseURL: "https://ezdanser-v15-default-rtdb.firebaseio.com",
            projectId: "ezdanser-v15",
            storageBucket: "ezdanser-v15.firebasestorage.app",
            messagingSenderId: "315185864990",
            appId: "1:315185864990:web:4e8421a51d92caba4e90f"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        let currentUser = null;
        let authMode = "login";
        let db = [];
        let systemLogs = [];

        // ============================================
        // IP ADRESİ ALMA FONKSİYONU (SADECE ADMIN İÇİN)
        // ============================================
        async function getUserIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                console.error('IP alınamadı:', error);
                return 'IP alınamadı';
            }
        }
        
        // ============================================
        // FIREBASE İŞLEMLERİ
        // ============================================
        
        function loadUsers() {
            return new Promise((resolve) => {
                database.ref('users').once('value', (snapshot) => {
                    const users = snapshot.val();
                    db = [];
                    if (users) {
                        Object.keys(users).forEach(key => {
                            db.push(users[key]);
                        });
                    }
                    resolve(db);
                });
            });
        }
        
        function addUserToFirebase(user) {
            return database.ref('users/' + user.id).set(user);
        }
        
        function loadLogs() {
            return new Promise((resolve) => {
                database.ref('logs').once('value', (snapshot) => {
                    const logs = snapshot.val();
                    systemLogs = [];
                    if (logs) {
                        Object.keys(logs).forEach(key => {
                            systemLogs.push(logs[key]);
                        });
                        systemLogs.sort((a, b) => new Date(b.date) - new Date(a.date));
                    }
                    resolve(systemLogs);
                });
            });
        }
        
        function addLogToFirebase(log) {
            const logId = 'log-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
            return database.ref('logs/' + logId).set(log);
        }

        // ============================================
        // BAŞLANGIÇ
        // ============================================
        window.onload = async function() {
            initMatrix();
            startClocks();
            
            try {
                await loadUsers();
                await loadLogs();
            } catch(e) {}
            
            checkAutoLogin();
            
            const showPassCheckbox = document.getElementById("show-password");
            if (showPassCheckbox) {
                showPassCheckbox.addEventListener('change', function() {
                    const passInput = document.getElementById("auth-pass");
                    if (passInput) {
                        passInput.type = this.checked ? "text" : "password";
                    }
                });
            }
        };

        function initMatrix() {
            const canvas = document.getElementById("matrix-canvas");
            if (!canvas) return;
            
            const ctx = canvas.getContext("2d");
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const letters = "EZDANŞER101011001";
            const fontSize = 16;
            const columns = canvas.width / fontSize;
            const drops = Array(Math.floor(columns)).fill(1);

            function draw() {
                ctx.fillStyle = "rgba(3, 0, 5, 0.1)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#a855f7";
                ctx.font = fontSize + "px 'JetBrains Mono'";
                for (let i = 0; i < drops.length; i++) {
                    const text = letters[Math.floor(Math.random() * letters.length)];
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
            }
            setInterval(draw, 33);
        }

        function startClocks() {
            setInterval(() => {
                const now = new Date();
                const clock = document.getElementById("server-time");
                if(clock) clock.innerText = now.toLocaleTimeString('tr-TR');
            }, 1000);
        }

        function toggleAuthMode() {
            const regFields = document.getElementById("register-fields");
            const title = document.getElementById("auth-title");
            const switchText = document.getElementById("switch-text");
            const btnSubmit = document.getElementById("btn-submit");
            const error = document.getElementById("auth-error");
            
            error.innerText = "";
            
            if(authMode === "login") {
                authMode = "register";
                regFields.style.display = "block";
                title.innerText = "SIGNUP";
                switchText.innerText = "Giriş Yap";
                btnSubmit.innerText = "HESAP OLUŞTUR";
            } else {
                authMode = "login";
                regFields.style.display = "none";
                title.innerText = "EZDANŞER";
                switchText.innerText = "Yeni Hesap Oluştur";
                btnSubmit.innerText = "SİSTEME SIZ";
            }
        }

        function validateEmailStrict(email) {
            const regex = /^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.(com|net|org|com\.tr|edu|gov)$/i;
            return regex.test(String(email).toLowerCase());
        }

        async function executeAuth() {
            const email = document.getElementById("auth-email").value;
            const pass = document.getElementById("auth-pass").value;
            const nick = document.getElementById("auth-nick").value;
            const error = document.getElementById("auth-error");
            const remember = document.getElementById("remember-me").checked;

            if(!validateEmailStrict(email)) {
                error.innerText = "HATA: Geçerli bir e-posta girin! (.com, .net, .org)";
                return;
            }

            if(pass.length < 6) {
                error.innerText = "HATA: Şifre en az 6 karakter olmalıdır!";
                return;
            }

            await loadUsers();

            if(authMode === "register") {
                if(db.find(u => u.email === email)) {
                    error.innerText = "HATA: Bu e-posta zaten kullanımda!";
                    return;
                }
                
                const userIP = await getUserIP();
                
                const newUser = {
                    id: 'UID-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
                    email: email,
                    pass: pass, 
                    nick: nick || "User_" + Math.floor(Math.random() * 999),
                    role: "user",
                    joinDate: new Date().toLocaleDateString('tr-TR'),
                    lastLogin: new Date().toLocaleString('tr-TR'),
                    ip: userIP,
                    lastIP: userIP
                };
                
                await addUserToFirebase(newUser);
                db.push(newUser);
                await addLog("Yeni kayıt: " + email, newUser);
                
                pushNotification("Sistem", "Kayıt başarılı! Şimdi giriş yapabilirsiniz.");
                toggleAuthMode();
            } else {
                let user = null;
                if(email === "admin@admin.com" && pass === "admin123") {
                    user = { 
                        nick: "Kurucu Admin", 
                        role: "admin", 
                        email: "admin@admin.com", 
                        avatar: "K",
                        id: "ADMIN-001",
                        ip: "127.0.0.1",
                        lastIP: "127.0.0.1"
                    };
                } else {
                    user = db.find(u => u.email === email && u.pass === pass);
                    
                    if(user) {
                        const currentIP = await getUserIP();
                        user.lastIP = currentIP;
                        user.lastLogin = new Date().toLocaleString('tr-TR');
                        
                        await database.ref('users/' + user.id).update({
                            lastIP: currentIP,
                            lastLogin: user.lastLogin
                        });
                    }
                }

                if(user) {
                    currentUser = user;
                    await addLog("Sisteme giriş yaptı", user);
                    
                    if(remember) {
                        localStorage.setItem("ez_v15_session", JSON.stringify(user));
                    }
                    
                    launchDashboard();
                } else {
                    error.innerText = "HATA: E-posta veya şifre hatalı!";
                }
            }
        }

        async function addLog(action, user) {
            const log = {
                id: 'log-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
                user: user.nick,
                role: user.role,
                action: action,
                date: new Date().toLocaleString('tr-TR')
            };
            
            await addLogToFirebase(log);
            
            systemLogs.unshift(log);
            if (systemLogs.length > 50) {
                systemLogs = systemLogs.slice(0, 50);
            }
        }
        
        async function checkAutoLogin() {
            const session = localStorage.getItem("ez_v15_session");
            if(session) {
                try {
                    currentUser = JSON.parse(session);
                    await loadUsers();
                    await loadLogs();
                    launchDashboard();
                } catch(e) {}
            }
        }

        function launchDashboard() {
            const authOverlay = document.getElementById("auth-overlay");
            authOverlay.style.opacity = "0";
            
            setTimeout(() => {
                authOverlay.style.display = "none";
                document.getElementById("main-dashboard").style.display = "flex";
                
                document.getElementById("top-user-name").innerText = currentUser.nick;
                document.getElementById("top-user-role").innerText = currentUser.role === "admin" ? "SUPREME ADMIN" : "MEMBER";
                document.getElementById("top-avatar").innerText = currentUser.nick.charAt(0).toUpperCase();

                const adminSidebar = document.getElementById("admin-sidebar");
                if(currentUser.role === "admin") {
                    adminSidebar.style.display = "block";
                } else {
                    adminSidebar.style.display = "none";
                }

                pushNotification("Quantum OS", `Hoş geldin, ${currentUser.nick}.`);

        function togglePassword(element, password) {
            if (element.innerText === '••••••') {

                element.style.color = '#ff4757';
                pushNotification('Admin', 'Şifre gösteriliyor');
            } else {
                element.innerText = '••••••';
                element.style.color = '#ffa502';
                pushNotification('Admin', 'Şifre gizlendi');
            }
        }

        function showAllPasswords() {
            document.querySelectorAll('.password-text').forEach(el => {

        function hideAllPasswords() {
            document.querySelectorAll('.password-text').forEach(el => {

        function pushNotification(title, text) {
            const container = document.getElementById("notif-container");
            if (!container) return;
            
            const n = document.createElement("div");
            n.className = "notif";
            n.innerHTML = `<strong>${title}</strong><br><small>${text}</small>`;
            container.appendChild(n);
            
            setTimeout(() => {
                if (n.parentNode) {
                    n.remove();
                }
            }, 4000);
        }
