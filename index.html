<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZDANŞER ULTIMATE | IP TRACKER v2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;900&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <!-- FIREBASE KÜTÜPHANELERİ -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg-deep: #030005;
            --bg-dark: #0a0112;
            --card-bg: rgba(15, 2, 28, 0.95);
            --accent: #a855f7;
            --accent-bright: #d8b4fe;
            --accent-glow: rgba(168, 85, 247, 0.5);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --danger: #ff4757;
            --success: #2ed573;
            --warning: #ffa502;
            --border-style: 1px solid rgba(168, 85, 247, 0.25);
            --panel-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 20px var(--accent-glow);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.4;
        }

        .scanline {
            width: 100%;
            height: 100px;
            z-index: 2;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(168, 85, 247, 0.05) 50%, rgba(0, 0, 0, 0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scanline 8s linear infinite;
            pointer-events: none;
        }

        @keyframes scanline {
            0% { bottom: 100%; }
            100% { bottom: -100px; }
        }

        #auth-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            background: radial-gradient(circle at center, transparent, var(--bg-deep));
            transition: opacity 0.8s ease;
        }

        .auth-card {
            width: 480px;
            padding: 60px;
            background: var(--card-bg);
            border-radius: 40px;
            border: var(--border-style);
            box-shadow: var(--panel-shadow);
            backdrop-filter: blur(25px);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, transparent, transparent, var(--accent));
            animation: rotate-border 6s linear infinite;
            z-index: -1;
        }

        @keyframes rotate-border {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .auth-card h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            letter-spacing: 12px;
            margin-bottom: 10px;
            color: var(--accent);
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .auth-card p {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            color: var(--accent);
            font-weight: 700;
        }

        .ez-input {
            width: 100%;
            padding: 18px 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(168, 85, 247, 0.1);
            border-radius: 16px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .ez-input:focus {
            background: rgba(168, 85, 247, 0.08);
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
        }

        .auth-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 25px 0;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            cursor: pointer;
            gap: 10px;
        }

        .checkbox-container input {
            accent-color: var(--accent);
            width: 18px;
            height: 18px;
        }

        .btn-glow {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(45deg, var(--accent), #6d28d9);
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 10px 30px -10px var(--accent);
            transition: 0.4s;
        }

        .btn-glow:hover {
            transform: translateY(-3px);
            filter: brightness(1.2);
            box-shadow: 0 15px 40px -10px var(--accent);
        }

        .auth-switch {
            margin-top: 25px;
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .auth-switch span {
            color: var(--accent);
            cursor: pointer;
            font-weight: 700;
        }

        #main-dashboard {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 50;
            background: var(--bg-deep);
            flex-direction: column;
        }

        .topbar {
            height: 80px;
            background: rgba(10, 1, 18, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: var(--border-style);
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.5rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 8px 15px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .avatar-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--accent), #4f46e5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: white;
            font-size: 0.9rem;
            border: 2px solid var(--accent);
        }

        .dashboard-body {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            background: rgba(10, 1, 18, 0.5);
            border-right: var(--border-style);
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-link {
            padding: 16px 20px;
            border-radius: 16px;
            color: var(--text-dim);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 600;
            transition: 0.3s;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .nav-link:hover {
            background: rgba(168, 85, 247, 0.05);
            color: white;
            padding-left: 25px;
        }

        .nav-link.active {
            background: rgba(168, 85, 247, 0.15);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.1);
        }

        .admin-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .section-label {
            font-size: 0.65rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            margin-left: 20px;
            font-weight: 900;
        }

        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .grid-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--card-bg);
            border: var(--border-style);
            border-radius: 24px;
            padding: 30px;
            transition: 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .stat-card h3 {
            font-size: 0.8rem;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--accent);
        }

        .glass-panel {
            background: var(--card-bg);
            border: var(--border-style);
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .ez-table {
            width: 100%;
            border-collapse: collapse;
        }

        .ez-table th {
            padding: 15px;
            font-size: 0.75rem;
            color: var(--accent);
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .ez-table td {
            padding: 18px 15px;
            font-size: 0.9rem;
            color: var(--text-main);
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }

        .badge {
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-admin { background: rgba(168, 85, 247, 0.2); color: var(--accent); border: 1px solid var(--accent); }
        .badge-user { background: rgba(148, 163, 184, 0.1); color: var(--text-dim); }

        #notif-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .notif {
            width: 350px;
            padding: 20px;
            background: rgba(15, 2, 28, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border-left: 5px solid var(--accent);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .btn-action {
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid var(--accent);
            background: transparent;
            color: white;
            cursor: pointer;
            transition: 0.3s;
            margin-left: 10px;
        }

        .btn-action:hover {
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .password-text {
            font-family: 'JetBrains Mono', monospace;
            color: var(--warning);
            font-weight: 700;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 5px;
            background: rgba(255, 165, 2, 0.1);
        }

        .ip-cell {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
        }

        @media (max-width: 1000px) {
            .sidebar { width: 80px; }
            .nav-link span, .section-label { display: none; }
            .ez-table { font-size: 0.7rem; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <canvas id="matrix-canvas"></canvas>
    <div class="scanline"></div>

    <div id="auth-overlay">
        <div class="auth-card">
            <h1 id="auth-title">EZDANŞER</h1>
            <p id="auth-desc">Quantum sistemine kimlik doğrulaması yapın.</p>

            <div id="login-form">

                </div>

                <div id="register-fields" style="display: none;">
                    <div class="form-group">
                        <label>Sistem Kullanıcı Adı</label>
                        <input type="text" id="auth-nick" class="ez-input" placeholder="Ezdanşer_PRO">
                    </div>
                </div>

                <div class="auth-actions">
                    <label class="checkbox-container">
                        <input type="checkbox" id="show-password">
                        <span>Şifreyi Göster</span>

                    <label class="checkbox-container">
                        <input type="checkbox" id="remember-me">

                <button class="btn-glow" onclick="executeAuth()">SİSTEME GİRİŞ</button>

                <div class="auth-switch">
                    Hesabın yok mu? <span onclick="toggleAuthMode()">Yeni Hesap Oluştur</span>
                </div>
            </div>
        </div>
    </div>

    <div id="main-dashboard">
        <div class="topbar">
            <div class="brand-logo">
                <div class="status-dot"></div>
                EZDANŞER <span style="font-size: 0.8rem;">IP TRACKER v2.0</span>
            </div>
            <div style="display: flex; gap: 30px; align-items: center;">
                <div id="server-time" style="font-family: monospace;">00:00:00</div>
                <div class="user-profile">
                    <div style="text-align: right;">
                        <div id="top-user-name" style="font-weight: 900;">Admin</div>
                        <div id="top-user-role" style="font-size: 0.65rem; color: var(--accent);">ADMIN</div>
                    </div>
                    <div class="avatar-circle" id="top-avatar">A</div>
                </div>
            </div>
        </div>

        <div class="dashboard-body">
            <div class="sidebar">
                <div class="section-label">MENU</div>
                <div class="nav-link active" onclick="switchTab('home', this)">🏠 <span>Dashboard</span></div>
                <div class="nav-link" onclick="switchTab('software', this)">🎯 <span>Yazılım</span></div>
                <div class="nav-link" onclick="switchTab('settings', this)">⚙️ <span>Profil</span></div>
                <div id="admin-sidebar" style="display: none;">
                    <div class="admin-section">
                        <div class="section-label">ADMIN</div>
                        <div class="nav-link" onclick="switchTab('users', this)">🛡️ <span>Kullanıcılar</span></div>
                        <div class="nav-link" onclick="switchTab('logs', this)">📜 <span>Loglar</span></div>
                    </div>
                </div>
                <div style="margin-top: auto;">
                    <div class="nav-link" style="color: var(--danger);" onclick="systemLogout()">🚪 <span>Çıkış</span></div>
                </div>
            </div>
            <div class="main-content" id="content-area"></div>
        </div>
    </div>

    <div id="notif-container"></div>

    <script>
        // FIREBASE KONFIGÜRASYONU
        const firebaseConfig = {
            apiKey: "AIzaSyDeLMAKuprzkCT87w_kArdRw0aEQEv_KE",
            authDomain: "ezdanser-v15.firebaseapp.com",
            databaseURL: "https://ezdanser-v15-default-rtdb.firebaseio.com",
            projectId: "ezdanser-v15",
            storageBucket: "ezdanser-v15.firebasestorage.app",
            messagingSenderId: "315185864990",
            appId: "1:315185864990:web:4e8421a51d92caba4e90f"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        let currentUser = null;
        let authMode = "login";
        let db = [];
        let systemLogs = [];

        // IP ADRESİ ALMA (DETAYLI)
        async function getUserIP() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                if (response.ok) {
                    const data = await response.json();
                    return {
                        ip: data.ip,
                        city: data.city || 'Bilinmiyor',
                        country: data.country_name || 'Bilinmiyor',
                        isp: data.org || 'Bilinmiyor',
                        full: `${data.ip} (${data.city || '?'}, ${data.country_name || '?'})`
                    };
                }
            } catch(e) {}
            
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return {
                    ip: data.ip,
                    city: 'Bilinmiyor',
                    country: 'Bilinmiyor',
                    isp: 'Bilinmiyor',
                    full: data.ip
                };
            } catch(e) {
                return { ip: 'IP alınamadı', full: 'IP alınamadı', city: '-', country: '-', isp: '-' };
            }
        }

        // VERİ YÜKLEME
        function loadUsers() {
            return new Promise((resolve) => {
                database.ref('users').once('value', (snapshot) => {
                    const users = snapshot.val();
                    db = [];
                    if (users) {
                        Object.keys(users).forEach(key => db.push(users[key]));
                    }
                    resolve(db);
                });
            });
        }

        function addUserToFirebase(user) {
            return database.ref('users/' + user.id).set(user);
        }

        function loadLogs() {
            return new Promise((resolve) => {
                database.ref('logs').once('value', (snapshot) => {
                    const logs = snapshot.val();
                    systemLogs = [];
                    if (logs) {
                        Object.keys(logs).forEach(key => systemLogs.push(logs[key]));
                        systemLogs.sort((a, b) => new Date(b.date) - new Date(a.date));
                    }
                    resolve(systemLogs);
                });
            });
        }

        function addLogToFirebase(log) {
            return database.ref('logs/' + log.id).set(log);
        }

        // BAŞLANGIÇ
        window.onload = async function() {
            initMatrix();
            setInterval(() => {
                const clock = document.getElementById("server-time");
                if(clock) clock.innerText = new Date().toLocaleTimeString('tr-TR');
            }, 1000);
            
            await loadUsers();
            await loadLogs();
            checkAutoLogin();
            
            document.getElementById("show-password").addEventListener('change', function() {
                const pass = document.getElementById("auth-pass");
                if(pass) pass.type = this.checked ? "text" : "password";
            });
        };

        function initMatrix() {
            const canvas = document.getElementById("matrix-canvas");
            if(!canvas) return;
            const ctx = canvas.getContext("2d");
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const letters = "EZDANŞER10";
            const fontSize = 16;
            const drops = Array(Math.floor(canvas.width / fontSize)).fill(1);
            
            function draw() {
                ctx.fillStyle = "rgba(3, 0, 5, 0.1)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#a855f7";
                ctx.font = fontSize + "px monospace";
                for(let i = 0; i < drops.length; i++) {
                    ctx.fillText(letters[Math.floor(Math.random() * letters.length)], i * fontSize, drops[i] * fontSize);
                    if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
            }
            setInterval(draw, 33);
        }

        function toggleAuthMode() {
            const regFields = document.getElementById("register-fields");
            const title = document.getElementById("auth-title");
            const switchText = document.querySelector(".auth-switch span");
            const btn = document.querySelector(".btn-glow");
            
            if(authMode === "login") {
                authMode = "register";
                regFields.style.display = "block";
                title.innerText = "KAYIT OL";
                switchText.innerText = "Giriş Yap";
                btn.innerText = "HESAP OLUŞTUR";
            } else {
                authMode = "login";
                regFields.style.display = "none";
                title.innerText = "EZDANŞER";
                switchText.innerText = "Yeni Hesap Oluştur";
                btn.innerText = "SİSTEME GİRİŞ";
            }
        }

        async function executeAuth() {
            const email = document.getElementById("auth-email").value;
            const pass = document.getElementById("auth-pass").value;
            const nick = document.getElementById("auth-nick").value;
            const error = document.getElementById("auth-error");
            const remember = document.getElementById("remember-me").checked;

            if(!email.includes('@') || !email.includes('.')) {
                error.innerText = "Geçerli bir e-posta girin!";
                return;
            }
            if(pass.length < 4) {
                error.innerText = "Şifre en az 4 karakter olmalı!";
                return;
            }

            await loadUsers();

            if(authMode === "register") {
                if(db.find(u => u.email === email)) {
                    error.innerText = "Bu e-posta zaten kayıtlı!";
                    return;
                }
                
                const ipData = await getUserIP();
                
                const newUser = {
                    id: 'UID-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
                    email: email,
                    pass: pass,
                    nick: nick || "User_" + Math.floor(Math.random() * 999),
                    role: "user",
                    joinDate: new Date().toLocaleString('tr-TR'),
                    lastLogin: new Date().toLocaleString('tr-TR'),
                    ip: ipData.full,
                    ipRaw: ipData.ip,
                    ipLocation: `${ipData.city}/${ipData.country}`,
                    ipISP: ipData.isp,
                    lastIP: ipData.full,
                    lastIPRaw: ipData.ip,
                    lastIPLocation: `${ipData.city}/${ipData.country}`
                };
                
                await addUserToFirebase(newUser);
                db.push(newUser);
                await addLog(`📝 Yeni kayıt: ${email} (${ipData.full})`, newUser);
                pushNotification("Başarılı", "Kayıt oluşturuldu! Giriş yapabilirsiniz.");
                toggleAuthMode();
            } 
            else {
                let user = db.find(u => u.email === email && u.pass === pass);
                
                if(email === "admin@admin.com" && pass === "admin123") {
                    user = { 
                        nick: "Admin", role: "admin", email: "admin@admin.com", 
                        id: "ADMIN-001", ip: "127.0.0.1", lastIP: "127.0.0.1",
                        ipLocation: "Localhost", lastIPLocation: "Localhost"
                    };
                }
                
                if(user) {
                    const ipData = await getUserIP();
                    user.lastIP = ipData.full;
                    user.lastIPRaw = ipData.ip;
                    user.lastIPLocation = `${ipData.city}/${ipData.country}`;
                    user.lastLogin = new Date().toLocaleString('tr-TR');
                    
                    if(user.id && user.id !== "ADMIN-001") {
                        await database.ref('users/' + user.id).update({
                            lastIP: ipData.full,
                            lastIPRaw: ipData.ip,
                            lastIPLocation: `${ipData.city}/${ipData.country}`,
                            lastLogin: user.lastLogin
                        });
                    }
                    
                    currentUser = user;
                    await addLog(`🔐 Giriş yaptı (${ipData.full})`, user);
                    
                    if(remember) localStorage.setItem("ez_session", JSON.stringify(user));
                    launchDashboard();
                } else {
                    error.innerText = "E-posta veya şifre hatalı!";
                }
            }
        }

        async function addLog(action, user) {
            const log = {
                id: 'log-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
                user: user.nick,
                role: user.role,
                action: action,
                date: new Date().toLocaleString('tr-TR')
            };
            await addLogToFirebase(log);
            systemLogs.unshift(log);
            if(systemLogs.length > 100) systemLogs = systemLogs.slice(0, 100);
        }

        async function checkAutoLogin() {
            const session = localStorage.getItem("ez_session");
            if(session) {
                currentUser = JSON.parse(session);
                await loadUsers();
                await loadLogs();
                launchDashboard();
            }
        }

        function launchDashboard() {
            const overlay = document.getElementById("auth-overlay");
            overlay.style.opacity = "0";
            setTimeout(() => {
                overlay.style.display = "none";
                document.getElementById("main-dashboard").style.display = "flex";
                document.getElementById("top-user-name").innerText = currentUser.nick;
                document.getElementById("top-user-role").innerText = currentUser.role === "admin" ? "🔱 ADMIN" : "👤 USER";
                document.getElementById("top-avatar").innerText = currentUser.nick.charAt(0).toUpperCase();
                
                const adminSidebar = document.getElementById("admin-sidebar");
                adminSidebar.style.display = currentUser.role === "admin" ? "block" : "none";
                
                switchTab('home');
                pushNotification("Hoş Geldin", `${currentUser.nick}, sisteme bağlandın.`);
            }, 500);
        }

        async function switchTab(tab, element = null) {
            const area = document.getElementById("content-area");
            if(!area) return;
            
            if(element) {
                document.querySelectorAll(".nav-link").forEach(l => l.classList.remove("active"));
                element.classList.add("active");
            }
            
            await loadUsers();
            await loadLogs();
            
            let html = "";
            
            if(tab === 'home') {
                html = `
                    <h1 style="font-family: Orbitron; margin-bottom: 30px;">📊 DASHBOARD</h1>
                    <div class="grid-stats">
                        <div class="stat-card"><h3>Toplam Üye</h3><div class="value">${db.length + 1}</div></div>
                        <div class="stat-card"><h3>Log Kaydı</h3><div class="value">${systemLogs.length}</div></div>
                        <div class="stat-card"><h3>Sistem Durumu</h3><div class="value">🟢 AKTİF</div></div>
                    </div>
                    <div class="glass-panel">
                        <h2>📢 Sistem Bilgisi</h2>
                        <p style="color: var(--text-dim); margin-top: 15px;">
                            ${currentUser.role === 'admin' ? 
                                `• Toplam kullanıcı: ${db.length}<br>• Son kayıt: ${db[db.length-1]?.email || 'Yok'}<br>• IP Takibi Aktif` : 
                                `Quantum Radar v1.0.0 yayında! Hemen indir.<br><br>🔒 IP adresiniz güvenlik amacıyla kaydedilir.`
                            }
                        </p>
                    </div>
                `;
            }
            else if(tab === 'software') {
                html = `
                    <h1 style="font-family: Orbitron; margin-bottom: 30px;">⚡ QUANTUM RADAR v1.0.0</h1>
                    <div class="glass-panel">
                        <div style="text-align: center; margin-bottom: 30px;">
                            <div style="font-size: 64px;">☕</div>
                            <h2 style="color: var(--accent);">Java .jar - ESP + Aimbot</h2>
                            <p style="color: var(--text-dim);">Anti-Ban korumalı | Hafif (16KB)</p>
                        </div>
                        <div style="display: flex; justify-content: center;">
                            <button class="btn-glow" onclick="downloadQuantum()" style="width: auto; padding: 15px 50px;">⬇️ HEMEN İNDİR</button>
                        </div>
                        <p style="text-align: center; margin-top: 20px; color: var(--warning); font-size: 0.8rem;">⚠️ Eğitim amaçlıdır. Sorumluluk size aittir.</p>
                    </div>
                `;
            }
            else if(tab === 'settings') {
                html = `
                    <h1 style="font-family: Orbitron; margin-bottom: 30px;">👤 PROFİL BİLGİLERİ</h1>
                    <div class="glass-panel" style="text-align: center;">
                        <div style="width: 120px; height: 120px; background: linear-gradient(45deg, var(--accent), #4f46e5); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 48px; font-weight: 900;">${currentUser.nick.charAt(0)}</div>
                        <h2>${currentUser.nick}</h2>
                        <p style="color: var(--accent);">${currentUser.role === 'admin' ? 'ADMINISTRATOR' : 'MEMBER'}</p>
                        <p style="margin-top: 20px; color: var(--text-dim);">
                            📧 ${currentUser.email}<br>
                            🆔 ${currentUser.id || 'Admin'}<br>
                            ${currentUser.role !== 'admin' ? `🔐 Kayıt IP: ${currentUser.ip || 'Bilinmiyor'}<br>📍 Son Giriş: ${currentUser.lastIPLocation || '-'}` : ''}
                        </p>
                    </div>
                `;
            }
            else if(tab === 'users' && currentUser.role === 'admin') {
                let rows = '';
                if(db.length > 0) {
                    rows = db.map(u => `
                        <tr>
                            <td><small>${u.id || '-'}</small></td>
                            <td><strong>${u.nick}</strong></td>
                            <td><small>${u.email}</small></td>
                            <td><span class="badge badge-user">USER</span></td>
                            <td><span class="password-text" data-password="${u.pass}" onclick="togglePassword(this, '${u.pass}')">••••••</span></td>
                            <td><small>${u.joinDate || '-'}</small></td>
                            <td><span class="ip-cell">${u.ip || u.ipRaw || '-'}</span></td>
                            <td><span class="ip-cell">${u.ipLocation || '-'}</span></td>
                            <td><span class="ip-cell">${u.lastIP || u.lastIPRaw || '-'}</span></td>
                        </tr>
                    `).join('');
                } else {
                    rows = '<tr><td colspan="9" style="text-align:center;">📭 Kullanıcı yok</td></tr>';
                }
                
                html = `
                    <h1 style="font-family: Orbitron; margin-bottom: 30px;">👥 KULLANICI YÖNETİMİ (${db.length})</h1>
                    <div class="glass-panel">
                        <div style="margin-bottom: 20px;">
                            <button class="btn-action" onclick="refreshUsers()">🔄 YENİLE</button>
                            <button class="btn-action" onclick="showAllPasswords()">🔓 TÜM ŞİFRELER</button>
                            <button class="btn-action" onclick="hideAllPasswords()">🔒 ŞİFRELERİ GİZLE</button>
                        </div>
                        <div style="overflow-x: auto;">
                            <table class="ez-table">
                                <thead>
                                    <tr><th>ID</th><th>Kullanıcı</th><th>E-posta</th><th>Yetki</th><th>Şifre</th><th>Kayıt</th><th>🔐 Kayıt IP</th><th>📍 Konum</th><th>🌐 Son IP</th></tr>
                                </thead>
                                <tbody>${rows}</tbody>
                            </table>
                        </div>
                        <div style="margin-top: 20px; padding: 15px; background: rgba(168,85,247,0.1); border-radius: 12px;">
                            <p style="color: var(--text-dim); font-size: 0.8rem;">🔒 IP adresleri sadece admin tarafından görüntülenebilir.</p>
                        </div>
                    </div>
                `;
            }
            else if(tab === 'logs' && currentUser.role === 'admin') {
                let rows = '';
                if(systemLogs.length > 0) {
                    rows = systemLogs.map(l => `
                        <tr><td><strong>${l.user}</strong></td><td><span class="badge ${l.role === 'admin' ? 'badge-admin' : 'badge-user'}">${l.role}</span></td><td>${l.action}</td><td><small>${l.date}</small></td></tr>
                    `).join('');
                } else {
                    rows = '<tr><td colspan="4" style="text-align:center;">📭 Log kaydı yok</td></tr>';
                }
                
                html = `
                    <h1 style="font-family: Orbitron; margin-bottom: 30px;">📋 SİSTEM LOGLARI</h1>
                    <div class="glass-panel">
                        <div style="margin-bottom: 20px;"><button class="btn-action" onclick="clearLogs()">🗑️ TEMİZLE</button></div>
                        <table class="ez-table">
                            <thead><tr><th>Kullanıcı</th><th>Rol</th><th>İşlem</th><th>Tarih</th></tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                `;
            }
            
            if(html) area.innerHTML = html;
        }

        function downloadQuantum() {
            if(currentUser) {
                addLog("📥 Quantum Radar indirildi", currentUser);
                pushNotification("İndirme", "Quantum Radar.jar indiriliyor...");
                const link = document.createElement('a');
                link.href = "https://dosya.co/67x89vzn43ay/quantumradar-1.0.0.jar";
                link.download = "quantumradar.jar";
                link.click();
            } else {
                pushNotification("Hata", "Önce giriş yapın!");
            }
        }

        async function refreshUsers() { await loadUsers(); switchTab('users'); pushNotification("Güncellendi", `${db.length} kullanıcı`); }
        
        function togglePassword(el, pass) {
            if(el.innerText === '••••••') { el.innerText = pass; el.style.color = '#ff4757'; }
            else { el.innerText = '••••••'; el.style.color = '#ffa502'; }
        }
        
        function showAllPasswords() {
            document.querySelectorAll('.password-text').forEach(el => {
                const p = el.getAttribute('data-password');
                if(p) { el.innerText = p; el.style.color = '#ff4757'; }
            });
            pushNotification("Admin", "Tüm şifreler gösteriliyor");
        }
        
        function hideAllPasswords() {
            document.querySelectorAll('.password-text').forEach(el => {
                el.innerText = '••••••'; el.style.color = '#ffa502';
            });
            pushNotification("Admin", "Tüm şifreler gizlendi");
        }
        
        async function clearLogs() {
            if(currentUser?.role === 'admin') {
                await database.ref('logs').remove();
                systemLogs = [];
                switchTab('logs');
                pushNotification("Sistem", "Loglar temizlendi");
            }
        }
        
        function pushNotification(title, msg) {
            const container = document.getElementById("notif-container");
            const n = document.createElement("div");
            n.className = "notif";
            n.innerHTML = `<strong>${title}</strong><br><small>${msg}</small>`;
            container.appendChild(n);
            setTimeout(() => n.remove(), 4000);
        }
        
        async function systemLogout() {
            if(currentUser) await addLog("Çıkış yaptı", currentUser);
            localStorage.removeItem("ez_session");
            location.reload();
        }
        
        window.addEventListener('resize', () => {
            const canvas = document.getElementById("matrix-canvas");
            if(canvas) { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        });
    </script>
</body>
</html>
